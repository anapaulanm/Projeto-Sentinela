services:
  - type: web
    name: oasis-hospital
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oasis-hospital-db
          property: connectionString

databases:
  - name: oasis-hospital-db
    plan: free
    region: ohio
    databaseName: oasis_hospital
    user: oasis_hospital
